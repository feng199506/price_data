    name_zh: 黄金
    dukascopy:
      id: xauusd
      provider_symbol: XAU/USD
      product_name: Spot gold
      instrument_type: dukascopy_spot_quote
      unit: USD per troy ounce
      currency: USD
      earliest_d1: "1999-06-03"
      earliest_m5: "2003-05-05"
      proxy_note: "Dukascopy Bank spot gold quote, not LBMA official fixing."
    indexmundi:
      slug: gold
      unit: USD per troy ounce
      description: "Gold (UK), 99.5% fine, London afternoon fixing, average of daily rates"
      source_name: World Bank via IndexMundi
    fred:
