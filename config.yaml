project:
  name: commodity_history
  timezone_output: UTC
  candle_label: left_open  # [start, start+freq)
  concurrency: 2
  retries: 5
  retry_pause_ms: 1000
  batch_size: 10
  batch_pause_ms: 1000

# 高频默认：执行年 2026 -> [2023-01-01, 2026-01-01)
# 所有接口的结束日期规则见 date_end_rules
intraday:
  start: "2023-01-01"
  end: "2026-01-01"          # exclusive
  timeframe: m5
  price_side: bid
  sample_start: "2024-03-04"  # Monday
  sample_end: "2024-03-09"    # exclusive Saturday; weekday window avoids empty weekend artifacts

daily:
  end: "2026-10-30"           # exclusive complete-day cutoff

date_end_rules:
  dukascopy_node: >
    Official filter is startDateMs <= timestamp < endDateMs.
    CLI --date-to / dates.to is exclusive. A call -from 2023-01-01 -to 2023-02-01
    returns bars with open time in [2023-01-01T00:00:00Z, 2023-02-01T00:00:00Z).
  eia_xls: >
    The XLS is a full published history snapshot, not a ranged query.
    The last data row is the last published trading day and is inclusive.
  indexmundi: >
    Monthly labels are calendar months. Listed months are inclusive.
    This is monthly averages, never to be resampled into daily bars.
  fred: >
    FRED CSV includes the DATE column on each observation day.
    The last dated row is inclusive. Missing values appear as a dot.

dependencies:
  python_requires: ">=3.10"
  dukascopy_node: "1.51.1"
  dukascopy_node_docs:
    cli: "https://www.dukascopy-node.app/config/cli"
    node: "https://www.dukascopy-node.app/config/node"
    repo: "https://github.com/Leo4815162342/dukascopy-node"
    historical_export: "https://www.dukascopy.com/swiss/english/marketwatch/historical/"
    range_of_markets: "https://www.dukascopy.com/swiss/english/cfd/range-of-markets/"

instruments:
